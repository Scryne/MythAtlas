<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MythAtlas - Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #0d0a07;
        color: #f4e4c1;
      }
      .card {
        max-width: 520px;
        border: 1px solid rgba(201, 168, 76, 0.3);
        border-radius: 14px;
        background: rgba(18, 14, 9, 0.86);
        padding: 1.4rem;
      }
      h1 {
        margin: 0 0 0.5rem 0;
        color: #c9a84c;
      }
      p {
        margin: 0.3rem 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>MythAtlas</h1>
      <p>Çevrimdışı modda sınırlı içerik mevcut.</p>
      <p>Bağlantı geri geldiğinde daha fazla içerik yüklenir.</p>
    </div>
  </body>
</html>
